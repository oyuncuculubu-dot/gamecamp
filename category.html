<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameCamp</title>
<meta name="description" content="GameCamp — Azərbaycan dilində canlı oyun və söhbət yayınları. CS2, PUBG, GTA/RP, podkastlar və musiqi."><meta name="theme-color" content="#000000"><meta property="og:site_name" content="GameCamp"><meta property="og:type" content="website"><meta property="og:title" content="GameCamp — canlı oyun və söhbət"><meta property="og:description" content="GameCamp — Azərbaycan dilində canlı oyun və söhbət yayınları. CS2, PUBG, GTA/RP, podkastlar və musiqi."><meta property="og:image" content="assets/hero_game.jpg"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icons3d/live.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="pro.css"><link rel="stylesheet" href="games.css"></head><body>
<header><div class="wrap"><a class="logo" href="index.html">Game<b>Camp</b></a><nav class="sw" id="sw"></nav>
<div class="r"><a class="btn g" href="#" id="b1" data-auth></a><a class="btn p" href="dashboard.html" id="b2"></a></div></div></header>
<main class="wrap"><nav class="crumb" id="crumb"></nav><section class="chero" id="hero"></section>
<div class="sec"><div><div class="kick" id="k2"></div><h2 id="gh"></h2></div><span class="cnt" id="cnt"></span></div><div class="grid" id="grid"></div>
<div class="sec"><div><div class="kick" id="k3"></div><h2>Digər kateqoriyalar</h2></div></div><div class="cats gm" id="more"></div></main>
<footer><div class="wrap"><div class="fl"><span>© 2026 GameCamp. Azərbaycan dilində oyun və söhbət yayınları.</span><nav><a href="info.html?p=about">Haqqımızda</a><a href="info.html?p=rules">Qaydalar</a><a href="info.html?p=support">Dəstək</a><a href="info.html?p=privacy">Məxfilik</a><a href="info.html?p=contact">Əlaqə</a></nav></div></div></footer>
<script src="data.js"></script><script src="site.js"></script><script>
const F=cfind(new URLSearchParams(location.search).get('c'))||{w:'game',c:D.game.cats[1]};W=F.w;const d=D[W],c=F.c,g=W=='game',id=cid(c),L=d.s.filter(x=>x[3]==c);
document.body.className=W;document.title=c+' · GameCamp';
sw.innerHTML=`<a href="index.html#game" class="${g?'on':''}">${ic('gamepad')}Oyun</a><a href="index.html#talk" class="${g?'':'on'}">${ic('mic')}Söhbət</a>`;b2.innerHTML=ic('radio')+'Yayına başla';
crumb.innerHTML=`<a href="index.html#${W}">${ic('back',14)}${d.name}</a><span>/</span><b>${c}</b>`;
const card=x=>`<a class="card" href="watch.html?id=${x[0]}"><div class="th"><img src="assets/${x[0]}.jpg" alt="${x[1]}" width="640" height="360"><span class="live">CANLI</span><span class="pill">${ic('eye',14)}${fmt(x[4])}</span><span class="pv">${ic('play',22)}</span><span class="pvbar"></span></div><div class="k">${gi(x[3],20)}${x[3]}</div><div class="ti">${x[1]}</div><div class="sub">${x[2]}</div></a>`;
const art=GI[c]?`<div class="cv"><img src="assets/games/${GI[c][0]}.webp" alt="${GI[c][1]}" width="450" height="600"></div>`:`<div class="cv ic">${i3(CI[c],120)}</div>`;
const FK='gc_fcats',fol=()=>GC.LS.get(FK,[]).includes(id);
function dh(){const v=L.reduce((a,x)=>a+x[4],0);document.getElementById("hero").innerHTML=`${GI[c]?`<div class="bg" style="background-image:url(assets/games/${GI[c][0]}.webp)"></div>`:''}${art}<div class="hx"><div class="kick">${ic(g?'gamepad':'mic',14)}${d.name} kateqoriyası</div><h1>${c}</h1>${GI[c]&&GI[c][1].toLowerCase()!=c.toLowerCase()?`<p class="full">${GI[c][1]}</p>`:''}<div class="st"><span>${ic('radio',16)}<b id="lc">${L.length}</b> canlı yayın</span><span>${ic('eye',16)}${fmt(v)} izləyici</span><span>${ic('user',16)}${fmt(1200+id.length*317+(fol()?1:0))} izləyən</span></div><div class="ha"><button type="button" class="btn ${fol()?'g on':'p'}" id="fb" aria-pressed="${fol()}">${ic(fol()?'check':'heart',16)}${fol()?'İzləyirsən':'Kateqoriyanı izlə'}</button><a class="btn g" href="dashboard.html#${W}">${ic('radio',16)}Yayına başla</a></div></div>`;
 fb.onclick=()=>{let a=GC.LS.get(FK,[]);const o=a.includes(id);a=o?a.filter(x=>x!=id):[...a,id];GC.LS.set(FK,a);GC.toast(o?c+' izləmədən çıxarıldı':c+' izlənilənlərə əlavə edildi');dh()}}
dh();k2.innerHTML=i3('live',28)+'İndi efirdə';k3.innerHTML=i3('grid',28)+'Kəşf et';gh.textContent=c+' yayınları';cnt.textContent=L.length+' canlı yayın';
grid.innerHTML=L.length?L.sort((a,b)=>b[4]-a[4]).map(card).join(''):`<div class="empty cempty">${i3('live',96)}<b>Hələ yayım yoxdur</b><span>${c} üzrə hazırda heç kim efirdə deyil. İlk yayınçı sən ol — izləyicilər səni gözləyir.</span><a class="btn p lg" href="dashboard.html#${W}" id="cta">${ic('radio',18)}Yayına başla</a></div>`;
more.classList.add('gm');more.innerHTML=d.cats.slice(1).filter(x=>x!=c).map(x=>{const n=d.s.filter(s=>s[3]==x).length;return `<a class="cat gc" href="category.html?c=${cid(x)}" data-t="${x}"><div class="bx">${GI[x]?`<img src="assets/games/${GI[x][0]}.webp" alt="${GI[x][1]}" width="450" height="600">`:`<span class="ib">${i3(CI[x],72)}</span>`}${n?'<span class="live">CANLI</span>':''}</div><b>${x}</b><small>${n?n+' canlı yayın':'Hələ yayım yoxdur'}</small></a>`}).join('');
</script><script src="pro.js"></script></body></html>
