<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameCamp</title>
<meta name="description" content="GameCamp haqqında məlumat, qaydalar, dəstək və əlaqə."><meta name="theme-color" content="#000000"><meta property="og:site_name" content="GameCamp"><meta property="og:type" content="website"><meta property="og:title" content="GameCamp — canlı oyun və söhbət"><meta property="og:description" content="GameCamp haqqında məlumat, qaydalar, dəstək və əlaqə."><meta property="og:image" content="assets/hero_game.jpg"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icons3d/live.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="pro.css"></head><body>
<header><div class="wrap"><a class="logo" href="index.html">Game<b>Camp</b></a><nav class="sw" id="sw"></nav>
<div class="r"><a class="btn g" href="#" id="b1" data-auth></a><a class="btn p" href="dashboard.html" id="b2"></a></div></div></header>
<main class="wrap"><div class="inav" id="inav"></div><article class="ipg" id="pg"></article></main>
<footer><div class="wrap"><div class="fl"><span>© 2026 GameCamp. Azərbaycan dilində oyun və söhbət yayınları.</span><nav><a href="info.html?p=about">Haqqımızda</a><a href="info.html?p=rules">Qaydalar</a><a href="info.html?p=support">Dəstək</a><a href="info.html?p=privacy">Məxfilik</a><a href="info.html?p=contact">Əlaqə</a></nav></div></div></footer>
<script src="data.js"></script><script src="site.js"></script><script>
const Q=new URLSearchParams(location.search),P=Q.get('p')||'about';W=localStorage.getItem('gc_w')||'game';document.body.className=W;
sw.innerHTML=`<a href="index.html#game">${ic('gamepad')}Oyun</a><a href="index.html#talk">${ic('mic')}Söhbət</a>`;b2.innerHTML=ic('radio')+'Yayına başla';
const T={
about:['Haqqımızda','GameCamp — Azərbaycan dilində oyun və söhbət yayınları üçün platforma.',`<p>GameCamp yerli yayınçıları və izləyiciləri bir yerə toplayır: CS2, GTA RP, PUBG, Minecraft və mobil oyunlardan tutmuş podkast, musiqi və idman söhbətlərinə qədər.</p><p>Məqsədimiz Azərbaycan dilində keyfiyyətli, təhlükəsiz və səmimi canlı yayın mühiti yaratmaqdır.</p><p>Bu sayt prototipdir: bütün funksiyalar brauzerdə demo rejimində işləyir.</p>`],
rules:['Qaydalar','İcma qaydaları hər kəs üçün eynidir.',`<ul><li>Hörmətli ol: təhqir, nifrət nitqi və təqib qadağandır.</li><li>Reklam və spam etmə.</li><li>Şəxsi məlumatları (telefon, ünvan) paylaşma.</li><li>Qanunsuz və 18+ məzmun yayımlamaq qadağandır.</li><li>Qaydaları pozan hesablar xəbərdarlıqsız bloklana bilər.</li></ul>`],
streamer:['Yayıncı qaydaları','Efirə çıxmazdan əvvəl oxu.',`<ul><li>Yayın başlığı və kateqoriya məzmuna uyğun olmalıdır.</li><li>Müəllif hüququ ilə qorunan musiqi və videoları icazəsiz yayımlama.</li><li>Yayın açarını heç kimlə paylaşma; şübhə olarsa paneldən yenilə.</li><li>Çatda moderasiyaya cavabdehsən.</li></ul><a class="btn p" href="dashboard.html">Yayıncı panelinə keç</a>`],
privacy:['Məxfilik','Məlumatların necə saxlanılır.',`<p>Bu demo versiyada heç bir məlumat serverə göndərilmir. Hesab, izləmələr, çat mesajları, xatırlatmalar və demo GC balansı yalnız sənin brauzerinin localStorage yaddaşında saxlanılır.</p><p>Şifrə açıq mətn kimi saxlanılmır: təsadüfi duz ilə SHA-256 heşi yadda saxlanılır.</p><p>Bütün məlumatları silmək üçün aşağıdakı düyməni istifadə et.</p><button class="btn g" id="wipe" type="button" style="display:inline-flex">Bütün yerli məlumatları sil</button>`],
support:['Dəstək','Tez-tez verilən suallar.',`<h3>Necə qeydiyyatdan keçim?</h3><p>Yuxarıdakı “Daxil ol” düyməsini bas və “Qeydiyyat” bölməsini seç.</p><h3>GC sikkələri nədir?</h3><p>Hədiyyə göndərmək üçün demo valyuta. Başlanğıcda 1 000 GC verilir, “Artır” düyməsi pulsuz demo sikkə əlavə edir. Real ödəniş yoxdur.</p><h3>Necə efirə çıxım?</h3><p>“Yayına başla” ilə yayıncı panelinə keç, başlıq və kateqoriyanı seç, “Efirə çıx” düyməsini bas.</p><p>Başqa sualın varsa <a href="info.html?p=contact" style="color:var(--c)">əlaqə formasından</a> yaz.</p>`],
contact:['Əlaqə','Bizə yaz, cavab verək.',`<form id="cf" novalidate><label for="cn">Ad</label><input id="cn" maxlength="60"><label for="ce">E-poçt</label><input id="ce" type="email" maxlength="80"><label for="cm">Mesaj</label><textarea id="cm" maxlength="1000"></textarea><p class="merr" id="cerr"></p><button class="btn p" type="submit">Göndər</button><p class="mnote">Demo: mesaj yalnız bu brauzerdə saxlanılır, heç yerə göndərilmir.</p></form>`],
followed:['İzlədiklərim','İzlədiyin yayınçılar.',''],
social:['Sosial şəbəkələr','Rəsmi səhifələrimiz tezliklə.',`<p>GameCamp-in <b style="color:#fff">${GC.esc(Q.get('s')||'sosial')}</b> səhifəsi tezliklə açılacaq. Hələlik yeniliklər üçün ana səhifəni izlə.</p><a class="btn p" href="index.html">Ana səhifə</a>`],
soon:['Tezliklə','Bu bölmə hazırlanır.',`<p>Bu səhifə üzərində işləyirik və tezliklə istifadəyə veriləcək.</p><a class="btn p" href="index.html">Ana səhifəyə qayıt</a>`]};
const t=T[P]||T.soon;document.title=t[0]+' · GameCamp';
inav.innerHTML=[['about','Haqqımızda'],['rules','Qaydalar'],['streamer','Yayıncı qaydaları'],['support','Dəstək'],['privacy','Məxfilik'],['contact','Əlaqə']].map(a=>`<a href="info.html?p=${a[0]}" class="${a[0]==P?'on':''}">${a[1]}</a>`).join('');
function draw(){let body=t[2];
 if(P=='followed'){const u=GC.user(),f=u?GC.LS.get(GC.ukey('follow'),[]):[];const all=[...D.game.s,...D.talk.s];
  body=!u?`<p>Siyahını görmək üçün daxil ol.</p><button class="btn p" type="button" id="li">Daxil ol</button>`:f.length?'<div class="rel" style="grid-template-columns:repeat(2,1fr)">'+f.map(n=>all.find(s=>s[2]==n)).filter(Boolean).map(s=>`<a class="card" href="watch.html?id=${s[0]}"><div class="th"><img src="assets/${s[0]}.jpg" alt=""><span class="live">CANLI</span><span class="pv">${ic('play',22)}</span><span class="pvbar"></span></div><div class="k">${s[3]}</div><div class="ti">${s[1]}</div><div class="sub">${s[2]}</div></a>`).join('')+'</div>':`<p>Hələ heç kimi izləmirsən.</p><a class="btn p" href="index.html">Yayınlara bax</a>`}
 pg.innerHTML=`<div class="kick">${ic('layout',14)}GameCamp</div><h1>${t[0]}</h1><p>${t[1]}</p>${body}`;
 const li=document.getElementById('li');if(li)li.onclick=()=>GC.openAuth('login',draw);
 const w=document.getElementById('wipe');if(w)w.onclick=()=>{if(confirm('Bütün GameCamp məlumatları bu brauzerdən silinsin?')){Object.keys(localStorage).filter(k=>k.startsWith('gc_')).forEach(k=>localStorage.removeItem(k));GC.render();GC.toast('Yerli məlumatlar silindi')}};
 const cf=document.getElementById('cf');if(cf){const u=GC.user();if(u){cn.value=cn.value||u.name;ce.value=ce.value||u.email}
  cf.onsubmit=e=>{e.preventDefault();const er=document.getElementById('cerr');if(cn.value.trim().length<2)return er.textContent='Adını daxil et.';if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(ce.value.trim()))return er.textContent='Düzgün e-poçt daxil et.';if(cm.value.trim().length<10)return er.textContent='Mesaj ən azı 10 simvol olmalıdır.';
   er.textContent='';const a=GC.LS.get('gc_contact',[]);a.push({n:cn.value.trim(),e:ce.value.trim(),m:cm.value.trim(),t:Date.now()});GC.LS.set('gc_contact',a);cf.reset();GC.toast('Mesajın qeydə alındı (demo)')}}}
draw();document.addEventListener('gc-auth',draw);
</script><script src="pro.js"></script></body></html>
