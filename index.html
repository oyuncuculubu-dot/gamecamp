<script src="data.js"></script><script src="site.js"></script><script>
const card=x=>`<a class="card" href="watch.html?id=${x[0]}"><div class="th"><img src="assets/${x[0]}.jpg" alt="${x[1]}" width="640" height="360"><span class="live">CANLI</span><span class="pill">${ic('eye',14)}${fmt(x[4])}</span><span class="pv">${ic('play',22)}</span><span class="pvbar"></span></div><div class="k">${gi(x[3],20)}${x[3]}</div><div class="ti">${x[1]}</div><div class="sub">${x[2]}</div></a>`;
bg.innerHTML=ic('gamepad')+'Oyun';bt.innerHTML=ic('mic')+'Söhbət';b2.innerHTML=ic('radio')+'Yayına başla';l1.innerHTML='Hamısına bax'+ic('arrow');

boot(d=>{const f=d.feat,g=W=='game';k1.innerHTML=i3('grid',28)+'Bölmələr';k2.innerHTML=i3('live',28)+'İndi efirdə';k3.innerHTML=i3('trophy',28)+'Həftənin reytinqi';k4.innerHTML=i3('star',28)+'Kəşf et';k5.innerHTML=i3('calendar',28)+'Proqram';document.querySelectorAll('.sc').forEach(a=>a.innerHTML=i3(a.dataset.s,44));hw.textContent=d.h;document.title=(g?'Oyun':'Söhbət')+' yayınları · GameCamp';grid.removeAttribute('aria-busy');
tick.innerHTML=[...d.s,...d.s].slice(0,10).map(x=>`<span>${ic('radio',12)}${x[2].toUpperCase()} · ${x[3].toUpperCase()} · ${fmt(x[4])}</span>`).join('');
mk.innerHTML=ic(g?'gamepad':'mic',14)+(g?'Bölmə 01':'Bölmə 02');big.innerHTML=g?'Oyun<span>.</span>':'Söhbət<span>.</span>';
mp.textContent=g?'Rəqabət, komanda və böyük anlar. Azərbaycanın ən yaxşı oyunçuları indi canlı efirdə.':'Mövzular, qonaqlar və musiqi. Səmimi söhbətlər Azərbaycan dilində, canlı efirdə.';
const fid=f.id||d.s[0][0];fimg.href=ftx.dataset.h='watch.html?id='+fid;fimg.innerHTML=`<img src="assets/${f.img}.jpg" alt=""><div class="tags"><span class="live">CANLI</span><span class="pill">${ic('eye',14)}${f.v} izləyici</span></div>`;
ftx.innerHTML=`<div class="kick">${ic('flame',14)}Günün yayını · ${f.cat}</div><h1>${f.t}</h1><p class="dek">${f.m}. Bu axşamın ən çox izlənən yayınına qoşul.</p><div class="by"><span class="av">${f.who[0]}</span><div><b>${f.who}</b>Aparıcı · ${f.cat}</div></div><a class="btn p lg" href="watch.html?id=${fid}" style="align-self:flex-start">${ic('play')}Canlı izlə</a>
<div class="toplist">`+d.s.slice(0,3).map((x,i)=>`<a class="tl" href="watch.html?id=${x[0]}"><span class="n">0${i+1}</span><div><b>${x[1]}</b><small>${x[2]} · ${x[3]}</small></div><span class="v">${ic('eye',14)}${fmt(x[4])}</span></a>`).join('')+'</div>';
cats.classList.toggle('gm',g);cats.innerHTML=d.cats.slice(1).map((c,i)=>{const s=d.s.filter(x=>x[3]==c);return g&&GI[c]?`<div class="cat gc" data-t="${c}" title="${GI[c][1]}"><div class="bx"><img src="assets/games/${GI[c][0]}.webp" alt="${GI[c][1]}" width="450" height="600">${s.length?'<span class="live">CANLI</span>':''}</div><b>${c}</b><small>${s.length?s.length+' canlı yayın':'Tezliklə'}</small></div>`:`<div class="cat" data-t="${c}">${i3(CI[c],64,'t3')}<img src="assets/${s[0][0]}.jpg" alt=""><span class="no">0${i+1}</span><div><b>${c}</b><small>${s.length} canlı yayın</small></div></div>`}).join('');
cats.querySelectorAll('.cat').forEach(t=>t.onclick=()=>{C=t.dataset.t;chips();document.getElementById('chips').scrollIntoView({behavior:'smooth',block:'center'})});
ranks.innerHTML=d.s.slice(0,5).map((x,i)=>`<div class="rk">${i<3?i3('medal'+(i+1),56,'md'):''}<div class="no">${i+1}</div><div class="ph"><img src="assets/${x[0]}.jpg" alt="${x[1]}" width="640" height="360"></div><b>${x[2]}</b><small>${x[3]} · ${fmt(x[4]*12)} izləyici</small><a class="btn g" href="watch.html?id=${x[0]}">${ic('plus',14)}İzlə</a></div>`).join('');
neu.innerHTML=d.neu.map(n=>`<div class="nw"><span class="av">${n[0][0]}</span><div><b>${n[0]}</b><small>${n[1]} · ${n[2]}</small></div><span class="tag">YENİ</span></div>`).join('');
soon.innerHTML=d.soon.map(n=>`<div class="ev"><div class="d"><small>${n[0]}</small><b>${n[1]}</b></div><div class="x"><b>${n[2]}</b><small>${n[3]}</small></div><button type="button" class="btn g rm" data-r="${n[2]}">${i3('bell',24)}<span class="hm">Xatırlat</span></button></div>`).join('');
const RM=()=>GC.LS.get(GC.ukey('remind'),[]);
soon.querySelectorAll('.rm').forEach(b=>{const upd=()=>{const o=RM().includes(b.dataset.r);b.classList.toggle('on',o);b.querySelector('.hm').textContent=o?'Xatırladılacaq':'Xatırlat';b.setAttribute('aria-pressed',o)};upd();
 b.onclick=()=>GC.need(()=>{let r=RM();const o=r.includes(b.dataset.r);r=o?r.filter(x=>x!=b.dataset.r):[...r,b.dataset.r];GC.LS.set(GC.ukey('remind'),r);upd();GC.toast(o?'Xatırlatma ləğv edildi':'Xatırlatma əlavə edildi: '+b.dataset.r)},'Xatırlatma qurmaq üçün daxil ol.')})});
sq.oninput=()=>{window.SQ=sq.value;chips()};
l1.onclick=e=>{e.preventDefault();C='Hamısı';window.SQ='';sq.value='';chips();grid.scrollIntoView({behavior:'smooth',block:'start'})};
addEventListener('hashchange',()=>{const w=location.hash=='#talk'?'talk':'game';if(w!=W)document.querySelector('[data-w="'+w+'"]').click()});
document.addEventListener('gc-auth',()=>document.querySelector('[data-w].on').click());
</script><script src="pro.js"></script></body></html>
