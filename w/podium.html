        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#ruby-heart-grad)" stroke="#FFD1DC" stroke-width="1"/>
      </g>
    </defs>
  </svg>

  <div class="winged-podium-stage" id="winged-podium-stage">
    <div class="podium-trio">
      <div class="medallion-unit rank-2" id="slot-rank-2"></div>
      <div class="medallion-unit rank-1" id="slot-rank-1"></div>
      <div class="medallion-unit rank-3" id="slot-rank-3"></div>
    </div>
    <div class="runners-floating-row" id="runners-row"></div>
  </div>

  <script>
    (function () {
      'use strict';

      const params = new URLSearchParams(window.location.search);
      if (params.get('backdrop') === '1' || params.get('demo') === '1' || params.get('preview') === '1') {
        document.body.classList.add('with-backdrop');
      }

      const crownOpt = /^[A-D]$/.test(params.get('crowns') || '') ? params.get('crowns') : '';
      const crownBase = crownOpt ? 'assets/crowns/options/' + crownOpt + '/' : 'assets/crowns/';
      const stageEl = document.getElementById('winged-podium-stage');
      if (params.get('layout') === 'row') document.body.classList.add('layout-row');
      const slot1 = document.getElementById('slot-rank-1');
      const slot2 = document.getElementById('slot-rank-2');
      const slot3 = document.getElementById('slot-rank-3');

      function formatCompactScore(n) {
        const num = Number(n) || 0;
        if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
        if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
        return num.toLocaleString('en-US');
      }

      function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }

      function cleanDisplayName(nick) {
        return String(nick || '').replace(/_AZ$/i, '').replace(/_Gaming$/i, '').replace(/_/g, ' ');
      }

      
      function updateSlotDom(slotEl, item, rank) {
        if (!slotEl.querySelector(".winged-frame-box")) {
          slotEl.innerHTML = renderMedallion(item, rank);
          return;
        }
        const defaults = [
          { uniqueId: "orxan.aliyev", nickname: "Orxan Əliyev", likes: 24950, diamonds: 48500, avatarUrl: "assets/avatars/avatar1.jpg" },
          { uniqueId: "kenan.m", nickname: "Kənan Məmmədov", likes: 15240, diamonds: 29100, avatarUrl: "assets/avatars/avatar2.jpg" },
          { uniqueId: "aysel.h", nickname: "Aysel Həsənova", likes: 9410, diamonds: 16800, avatarUrl: "assets/avatars/avatar3.jpg" },
        ];
        const data = item || defaults[rank - 1];
        const avatarSrc = TF.asset(data.avatarUrl || (window.TikFinityAvatars && window.TikFinityAvatars.getAvatar(data.uniqueId, rank - 1)));
        const displayName = cleanDisplayName(data.nickname);
        const val = typeof data.diamonds === "number" ? data.diamonds : data.likes;

        const portraitImg = slotEl.querySelector(".portrait-slot img");
        if (portraitImg && portraitImg.getAttribute("src") !== avatarSrc) {
          portraitImg.setAttribute("src", avatarSrc);
        }
        const capAva = slotEl.querySelector(".capsule-ava");
        if (capAva && capAva.getAttribute("src") !== avatarSrc) capAva.setAttribute("src", avatarSrc);
        const nameEl = slotEl.querySelector(".capsule-name");
        if (nameEl) nameEl.textContent = displayName;
        const scoreEl = slotEl.querySelector(".score-num") || slotEl.querySelector(".capsule-score span");
        if (scoreEl) scoreEl.textContent = formatCompactScore(val);
      }
  
      function renderMedallion(leader, rank) {
        const defaults = [
          { uniqueId: 'orxan.aliyev', nickname: 'Orxan Əliyev', likes: 24950, avatarUrl: 'assets/avatars/avatar1.jpg' },
          { uniqueId: 'kenan.m', nickname: 'Kənan Məmmədov', likes: 15240, avatarUrl: 'assets/avatars/avatar2.jpg' },
          { uniqueId: 'aysel.h', nickname: 'Aysel Həsənova', likes: 9410, avatarUrl: 'assets/avatars/avatar3.jpg' },
        ];
        const item = leader || defaults[rank - 1];
        const avatarSrc = TF.asset(item.avatarUrl || (window.TikFinityAvatars && window.TikFinityAvatars.getAvatar(item.uniqueId, rank - 1)));
        const frameSrc = rank === 1
          ? 'assets/frames/frame_winged_gold.png'
          : rank === 2
          ? 'assets/frames/frame_winged_silver.png'
          : 'assets/frames/frame_winged_bronze.png';

        const displayName = cleanDisplayName(item.nickname);

        return `
          <div class="winged-frame-box">
            <div class="medallion-aura"></div>
            <div class="portrait-slot">
              <img src="${escapeHtml(avatarSrc)}" alt="${escapeHtml(displayName)}" />
            </div>
            <img class="winged-frame-img" src="${frameSrc}" alt="Rank #${rank} Frame" />
            <span class="shield-rank-engraving">#${rank}</span>
          </div>
          <div class="crystal-capsule">
            <span class="ava-wrap"><img class="capsule-ava" src="${escapeHtml(avatarSrc)}" alt="" /><span class="crown-contact"></span>${rank===1?`<span class="crown1-wrap" style="--crown-url:url('${crownBase}crown_gold.png')"><img class="crown1-glow" src="${crownBase}crown_gold.png" alt="" /><img class="capsule-crown" src="${crownBase}crown_gold.png" alt="" /><span class="crown1-shine"></span><i class="crown-spark" style="left:2px;top:14px"></i><i class="crown-spark" style="left:41px;top:-8px;animation-delay:.6s"></i><i class="crown-spark" style="left:84px;top:18px;animation-delay:1.2s"></i><i class="crown-spark" style="left:41px;top:44px;animation-delay:.9s"></i></span>`:`<img class="capsule-crown" src="${crownBase}crown_${rank===2?'silver':'bronze'}.png" alt="" />`}</span>
            <span class="capsule-text"><span class="capsule-name">${escapeHtml(displayName)}</span>
            <span class="capsule-score">
              <span class="score-num" data-rank="${rank}">${formatCompactScore(item.likes)}</span>
              <svg class="cap-heart" viewBox="0 0 24 24" width="24" height="24"><use href="#icon-ruby-heart"/></svg>
            </span></span>
          </div>
        `;
      }

      let toastEl=null,toastT=null;
      function showToast(e){
        if(!toastEl){toastEl=document.createElement('div');toastEl.className='like-toast';stageEl.appendChild(toastEl);}
        const src=TF.asset(e.avatarUrl||(window.TikFinityAvatars&&window.TikFinityAvatars.getAvatar(e.uniqueId,0))||'');
        toastEl.innerHTML='<img src="'+escapeHtml(src)+'" alt=""><b>'+escapeHtml(cleanDisplayName(e.nickname))+'</b><span>+'+(e.added||1)+' ❤️</span>';
        toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),2800);
      }
      let prevTop1Id = 'qara_qartal99';
      let fx = null;

      function renderState(state) {
        if (!state) return;
        const leaders = Array.isArray(state.leaders) ? state.leaders : [];
        const newTop1Id = leaders[0] ? leaders[0].uniqueId : prevTop1Id;
        const swapped = Boolean(prevTop1Id && newTop1Id && prevTop1Id !== newTop1Id);
        prevTop1Id = newTop1Id;

        updateSlotDom(slot1, leaders[0], 1);
        updateSlotDom(slot2, leaders[1], 2);
        updateSlotDom(slot3, leaders[2], 3);

        if (fx) {
          if (state.config) {
            fx.updateSettings({
              crystalShimmer: state.config.crystalShimmer !== false,
              levitation3D: state.config.levitation3D !== false,
              burstWaves: state.config.burstWaves !== false,
              swapEffects: state.config.swapEffects !== false,
            });
          }
          null;
        }
        if (fx) {
          if (swapped || (state.lastLikeEvent && state.lastLikeEvent.rankSwapped)) {
            fx.triggerRankSwap();
          } else if (state.type === 'likeBurst' && state.lastLikeEvent) {
            const targetRank = state.lastLikeEvent.rank || 1;
            if (targetRank <= 3) {
              fx.triggerBurst(targetRank, state.lastLikeEvent.added || 50);
            }
          }
        }
      }

      const initialLeaders = [
        { rank: 1, uniqueId: 'orxan.aliyev', nickname: 'Orxan Əliyev', likes: 24950, avatarUrl: 'assets/avatars/avatar1.jpg' },
        { rank: 2, uniqueId: 'kenan.m', nickname: 'Kənan Məmmədov', likes: 15240, avatarUrl: 'assets/avatars/avatar2.jpg' },
        { rank: 3, uniqueId: 'aysel.h', nickname: 'Aysel Həsənova', likes: 9410, avatarUrl: 'assets/avatars/avatar3.jpg' },
      ];

      renderState({ leaders: initialLeaders });

      if (window.TikFinityPodiumFX) {
        fx = window.TikFinityPodiumFX.createPodiumFX({
          stageEl,
          mode: 'likes',
        });
      }

      // If opened with ?burst=1 (for high-DPI screenshot of live golden burst), fire an immediate burst
      if (params.get('burst') === '1' && fx) {
        fx.triggerBurst(1, 150, 0.2);
        fx.triggerBurst(2, 50, 0.35);
        fx.setDeterministicTime(0.62);
      }

      // Deterministic 5-second 60 FPS video choreography hook
      let timelineInitialized = false;
      let timelineSwappedDom = false;
      window.__setSimTime = window.__stepDemoTimeline = function (tSec) {
        if (!fx) return;
        if (!timelineInitialized) {
          timelineInitialized = true;
          fx.clearBursts();
          // Schedule metallic shader bursts across the 6.0s 60fps showcase
          fx.triggerBurst(1, 250, 0.15);
          fx.triggerBurst(2, 180, 1.15);
          fx.triggerBurst(1, 500, 2.10);
          fx.triggerRankSwap(3.35);
          fx.triggerBurst(3, 150, 4.80);
        }
        if (tSec >= 3.35 && !timelineSwappedDom) {
          timelineSwappedDom = true;
          updateSlotDom(slot1, { uniqueId: "kenan.m", nickname: "Kənan Məmmədov", likes: 25600, avatarUrl: "assets/avatars/avatar2.jpg" }, 1);
          updateSlotDom(slot2, { uniqueId: "orxan.aliyev", nickname: "Orxan Əliyev", likes: 25400, avatarUrl: "assets/avatars/avatar1.jpg" }, 2);
        } else if (tSec < 3.35 && timelineSwappedDom) {
          timelineSwappedDom = false;
          updateSlotDom(slot1, { uniqueId: "orxan.aliyev", nickname: "Orxan Əliyev", likes: 24950, avatarUrl: "assets/avatars/avatar1.jpg" }, 1);
          updateSlotDom(slot2, { uniqueId: "kenan.m", nickname: "Kənan Məmmədov", likes: 15240, avatarUrl: "assets/avatars/avatar2.jpg" }, 2);
        }
        fx.setDeterministicTime(tSec);
      };

      TF.connect((d) => { try { renderState(d); } catch (_) {} }, { noLive: params.get('static') === '1', onState: (data) => { if (data && data.leaders && params.get('burst') !== '1') renderState(data); } });
    })();
  </script>
<script>
(function(){function fit(){var el=document.querySelector('.winged-podium-stage');if(!el)return;el.style.transform='none';var w=el.offsetWidth,h=el.offsetHeight;var k=Math.min(innerWidth*0.96/w,innerHeight*0.96/h);el.style.transform='scale('+k+')';}
addEventListener('resize',fit);addEventListener('load',fit);new MutationObserver(function(){requestAnimationFrame(fit)}).observe(document.body,{childList:true,subtree:true});setTimeout(fit,300);})();
</script>
</body>
</html>
